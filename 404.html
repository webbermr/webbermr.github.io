<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arrivl — Invite</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #080D18;
      color: #F1F5F9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #0F1A2E;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .emoji { font-size: 56px; }
    h1 { font-size: 28px; font-weight: 800; margin-top: 12px; }
    p { color: #94A3B8; margin-top: 14px; line-height: 1.5; font-size: 15px; }
    p.muted { color: #475569; font-size: 13px; }
    .code {
      margin-top: 20px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #4ADE80;
      background: rgba(74, 222, 128, 0.12);
      border: 1px solid rgba(74, 222, 128, 0.35);
      border-radius: 12px;
      padding: 14px 18px;
    }
    .btn {
      display: block;
      margin-top: 20px;
      padding: 15px;
      border-radius: 14px;
      background: #4ADE80;
      color: #08110A;
      font-weight: 800;
      font-size: 16px;
      text-decoration: none;
    }
    .btn.secondary {
      background: transparent;
      color: #94A3B8;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card" id="card"></div>
  <script>
    (function () {
      var match = window.location.pathname.match(/\/join\/([A-Za-z0-9]+)/i);
      var card = document.getElementById("card");
      if (match) {
        var code = match[1].toUpperCase();
        document.title = "Join an event on Arrivl";
        card.innerHTML =
          '<div class="emoji">🚗</div>' +
          "<h1>You're invited to Arrivl</h1>" +
          "<p>Someone wants to share live arrival ETAs with you. " +
          "Your invite code:</p>" +
          '<div class="code">' + code + "</div>" +
          '<a class="btn" href="arrivl://join/' + code + '">Open in Arrivl</a>' +
          "<p class='muted'>Don't have the app yet? Install Arrivl, then " +
          "open it and enter the code above on the Join screen.</p>";
      } else {
        document.title = "Arrivl — Not found";
        card.innerHTML =
          '<div class="emoji">🚗</div>' +
          "<h1>Page not found</h1>" +
          "<p>That link doesn't lead anywhere on Arrivl.</p>" +
          '<a class="btn secondary" href="/">Go to the home page</a>';
      }
    })();
  </script>
</body>
</html>
