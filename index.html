<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arrivl</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #080D18;
      color: #F1F5F9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #0F1A2E;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 44px;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .emoji { font-size: 64px; }
    h1 { font-size: 36px; font-weight: 800; margin-top: 12px; }
    p { color: #94A3B8; margin-top: 14px; line-height: 1.5; font-size: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🚗</div>
    <h1>Arrivl</h1>
    <p>Real-time group arrivals. Share live ETAs to a shared destination —
       no accounts, no fuss.</p>
  </div>
</body>
</html>
